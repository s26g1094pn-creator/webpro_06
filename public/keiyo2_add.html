<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>京葉線の駅を追加</title>
</head>
<body>
  <h1>京葉線の駅を追加</h1>
  <form action="/keiyo2_add" method="post">
    <p><label>駅コード <input type="text" name="code" required></label></p>
    <p><label>駅名 <input type="text" name="name" required></label></p>
    <p><label>乗り換え線（任意） <input type="text" name="change"></label></p>
    <p><label>乗車人員（人） <input type="text" name="passengers" inputmode="numeric" pattern="[0-9]+" required></label></p>
    <p><label>東京駅からの距離（km） <input type="text" name="distance" inputmode="decimal" pattern="[0-9]+(\.[0-9]+)?" required></label></p>
    <button type="submit">登録する</button>
  </form>
  <p><a href="/keiyo2">駅一覧に戻る</a></p>
</body>
</html>
